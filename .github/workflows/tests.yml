name: Tenant Guardian tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    # Ubuntu is pinned: setup-python publishes no Python 3.9 build for ubuntu-latest (26.04), and
    # the README promises 3.9+. macOS runs once because /var and /tmp are symlinks there, which the
    # output guard must tell apart from a symlink planted in the repository.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.9', '3.11', '3.13']
        include:
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/tenant-guardian/tests -v
      - run: python docs/build_example.py
