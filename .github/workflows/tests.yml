name: Tenant Guardian tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    # Pinned: setup-python publishes no Python 3.9 build for ubuntu-latest (26.04), and the
    # README promises 3.9+.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/tenant-guardian/tests -v
      - run: python docs/build_example.py
